<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="#27272a" stroke-width="8"/>

  <!-- Dial Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neon)" stroke-width="12" stroke-dasharray="1130" stroke-dashoffset="380" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Digital Bedside Numeral Graphic 09:41 -->
  <text x="256" y="278" font-family="-apple-system, system-ui, BlinkMacSystemFont, sans-serif" font-size="110" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">9:41</text>
  
  <!-- Subtle Bedside Stand dock line -->
  <path d="M 176 360 L 336 360" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
</svg>
